        // create product
        const btnCreate = document.getElementById("btn-create");
        const base_url = "https://jsonplaceholder.typicode.com/comments";
        btnCreate.addEventListener('click', async()=>{
            // perform about create product into api

        const newProduct = {
      title: "New Product",
      price: 10,
      description: "A description",
      categoryId: 1,
      images: ["https://placehold.co/600x400"]
    };
        // mechanism for post new product in api
        try{
            new res = await fetch(base_url, {
            method: "POST",
            headers:{
                'Content-Type': "application/json"
            },
            body: JSON.stringify(newProduct) // convert object of new product into json

        });if(res.ok){
            return await res.json();
        }else{
            return 'You cant create new product';
        }

        }catch{

        }
