<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <!-- {
    "firstName": "Panharo",
    "lastName": "Keo",
    "age": 19,
    "position": "IT instructor",
    "hobbies": [
      "Listening to music",
      "Coding challenge",
      "Walking as exercises"
    ],
    "isMarried": false,
    "salary": 0.0
  } -->
    <!-- define structure of UI -->
    <div
      class="container grid lg:grid-cols-4 md:grid-cols-3 sm:grid-cols-2 grid-cols-1 gap-8 p-4"
      id="card-container"
    >
      <!-- body of each cards -->
       
    </div>
  </body>
  <!-- adding js script with json -->
  <script>
    async function displayPeopleCard() {
      // inout : url_base / resource,
      //init (GET can be not define) but for post ,
      // put delete patch we should define : method, content-type,
      let res = fetch("./people.json");
      console.log("The log of respone: ", res);
      res.then((data) => data.json())
        .then(data => {
            //retrieve data as array object
          const personCard = data.map(person =>{
            console.log(`The value of person: ${person.firstName}`)
             return `
             <div class="container border rounded-lg p-4">
            <h1>My name is ${person.firstName} ${person.lastName}</h1>
            <h2>My age is ${person.age}</h2>
            <hr>
            <h3>My position is ${person.position}</h3>
            <h4>I usually: ${person.hobbies}</h4>
            <hr>
            <p>Currently, I got rate ${person.salary}</p>
            <img src="${person.image_url}" alt="Person image">
         </div>
          `
        console.log("Person card: ", personCard)
        }).join('');
        // insert into dom
        document.getElementById("card-container").innerHTML += personCard;
    })
        .catch((err) => console.log(err));
      // const data = res.json();
      // console.log("The data of people: ", data);
    }
    // calling function
    displayPeopleCard();
  </script>
</html>
